name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-asan-ubsan
            os: ubuntu-22.04
            cmake_flags: "-DHARNESS_ENABLE_ASAN=ON -DHARNESS_BUILD_TESTS=ON"
            install_deps: true
          - name: linux-tsan
            os: ubuntu-22.04
            cmake_flags: "-DHARNESS_ENABLE_TSAN=ON -DHARNESS_BUILD_TESTS=ON"
            install_deps: true
          - name: linux-release
            os: ubuntu-22.04
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DHARNESS_BUILD_TESTS=ON"
            install_deps: true
          - name: macos-asan-ubsan
            os: macos-14
            cmake_flags: "-DHARNESS_ENABLE_ASAN=ON -DHARNESS_BUILD_TESTS=ON"
          - name: macos-tsan
            os: macos-14
            cmake_flags: "-DHARNESS_ENABLE_TSAN=ON -DHARNESS_BUILD_TESTS=ON"
          - name: windows-msvc
            os: windows-2022
            cmake_flags: "-DHARNESS_BUILD_TESTS=ON"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux deps
        if: matrix.install_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libasound2-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_flags }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --config Debug

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/plugin-harness_artefacts/Debug/plugin-harness --version
          ./build/plugin-harness_artefacts/Debug/plugin-harness --list-scenarios
          ./build/plugin-harness_artefacts/Debug/plugin-harness --list-formats

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "build/plugin-harness_artefacts/Debug/plugin-harness.exe" --version
          & "build/plugin-harness_artefacts/Debug/plugin-harness.exe" --list-scenarios
          & "build/plugin-harness_artefacts/Debug/plugin-harness.exe" --list-formats

      - name: Run self-tests
        run: ctest --test-dir build --output-on-failure -C Debug
